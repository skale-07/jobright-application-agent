<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 40" width="232" height="40">
  <!-- Dispatch monochrome lockup: the whole lockup in one text color, for
       contexts where the accent would fight (dense docs, print-ish
       surfaces, co-branding rows). Theme-aware. DESIGN.md §1.5. -->
  <style>
    .ink { stroke: #e6edf3; }
    .ink-fill { fill: #e6edf3; }
    .well { fill: #0d1117; }
    text {
      font-family: "SFMono-Regular", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    @media (prefers-color-scheme: light) {
      .ink { stroke: #1f2328; }
      .ink-fill { fill: #1f2328; }
      .well { fill: #f6f8fa; }
    }
  </style>
  <g transform="translate(4, 4)">
    <path class="ink" d="M8 24 L24 8" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle class="well ink" cx="8" cy="24" r="3.2" stroke-width="2.6"/>
    <circle class="well ink" cx="16" cy="16" r="3.2" stroke-width="2.6"/>
    <circle class="ink-fill" cx="24" cy="8" r="4"/>
  </g>
  <text x="44" y="27" class="ink-fill">dispatch·console</text>
</svg>
