<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resume download fixture</title>
  </head>
  <body>
    <h1>Local resume download fixture (no JobRight)</h1>
    <button type="button" id="improve-resume">
      Improve My Resume For This Job
    </button>
    <script>
      // Minimal synthetic PDF matching greenhouse sample-resume.pdf
      const PDF_BYTES = new Uint8Array([
        0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x31, 0x0a, 0x31, 0x20, 0x30,
        0x20, 0x6f, 0x62, 0x6a, 0x3c, 0x3c, 0x3e, 0x3e, 0x65, 0x6e, 0x64, 0x6f,
        0x62, 0x6a, 0x0a, 0x74, 0x72, 0x61, 0x69, 0x6c, 0x65, 0x72, 0x3c, 0x3c,
        0x3e, 0x3e, 0x0a, 0x25, 0x25, 0x45, 0x4f, 0x46, 0x0a,
      ]);
      document.getElementById("improve-resume").addEventListener("click", () => {
        const blob = new Blob([PDF_BYTES], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "resume.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    </script>
  </body>
</html>
