<!DOCTYPE html>
<html lang="en">
<head>
  <title>Software Engineer Intern — Acme</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6Lc_fixture_key" async defer></script>
</head>
<body>
  <h1>Software Engineer Intern</h1>
  <form id="application_form" action="/acme/jobs/12345/applications">
    <div class="field">
      <label for="first_name">First Name *</label>
      <input id="first_name" name="job_application[first_name]" type="text" required />
    </div>
    <div class="field">
      <label for="last_name">Last Name *</label>
      <input id="last_name" name="job_application[last_name]" type="text" required />
    </div>
    <div class="field">
      <label for="email">Email *</label>
      <input id="email" name="job_application[email]" type="email" required />
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel" />
    </div>
    <div class="field">
      <label for="resume">Resume *</label>
      <input id="resume" name="job_application[resume]" type="file" required />
    </div>
    <input type="submit" value="Submit Application" />
  </form>
  <!-- v3 badge renders but never blocks; it arms at submit time only -->
  <div class="grecaptcha-badge" data-style="bottomright"></div>
  <script>
    grecaptcha.ready(function () {
      grecaptcha.execute('6Lc_fixture_key', { action: 'submit' });
    });
  </script>
</body>
</html>
