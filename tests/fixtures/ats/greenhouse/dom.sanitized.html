<!DOCTYPE html>
<html lang="en">
<head><title>Software Engineering Intern — Acme</title></head>
<body>
  <div class="app">
    <h1>Software Engineering Intern</h1>
    <p>Powered by Greenhouse</p>
    <form id="application_form" action="https://boards.greenhouse.io/acme/jobs/12345" method="post">
      <div class="field">
        <label for="first_name">First name *</label>
        <input id="first_name" name="job_application[first_name]" type="text" required />
      </div>
      <div class="field">
        <label for="last_name">Last name *</label>
        <input id="last_name" name="job_application[last_name]" type="text" required />
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input id="email" name="job_application[email]" type="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="job_application[phone]" type="tel" />
      </div>
      <div class="field">
        <label for="school">School / University</label>
        <input id="school" name="job_application[answers][school]" type="text" />
      </div>
      <div class="field">
        <label for="grad_year">Expected graduation year</label>
        <input id="grad_year" name="job_application[answers][grad]" type="text" />
      </div>
      <div class="field">
        <label for="sponsorship">Will you now or in the future require sponsorship?</label>
        <select id="sponsorship" name="job_application[answers][sponsor]" required>
          <option value="">Please select</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="field">
        <label for="resume">Resume</label>
        <input id="resume" name="job_application[resume]" type="file" />
      </div>
      <div class="field">
        <label for="cover">Cover letter</label>
        <input id="cover" name="job_application[cover_letter]" type="file" />
      </div>
      <input type="submit" value="Submit application" />
    </form>
  </div>
</body>
</html>
