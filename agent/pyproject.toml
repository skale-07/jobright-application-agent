[project]
name = "jobright-agent"
version = "0.1.0"
description = "browser-use authoring sidecar for jobright-application-agent (Phase 6 J1). Build-time tool only; never part of the application pipeline."
requires-python = ">=3.11"
dependencies = [
    "browser-use==0.13.7",
    # Anthropic client for browser_use.llm.ChatAnthropic (preferred nav
    # provider when ANTHROPIC_API_KEY is set; OpenAI remains the fallback).
    "anthropic>=0.40",
]

[tool.setuptools]
packages = ["jobright_agent"]
